<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Kaname's katana, drawn (blade out), for viewing: a sprite-forge PROPOSAL, not canon (D129); Unity owns the look (D124).
       Follows D122: a dark-steel blade with a subtle curve, a distinct cutting edge and a restrained violet edge (a thin line, a soft glow, two faint wisps).
       The hilt is the one on Kaname: wrapped deep violet, steel guard and pommel, a violet glow standing in for the curse; no white tags or wrapping.
       No glint at the tip: a pale glint is the parry's telegraph language. Nothing red or yellow, no smoke.
       Drawn pointing up-right, edge down, as the blade lies in his hand; the whole thing floats gently. -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
      values="0 0; 0 -0.4; 0 -0.9; 0 -1.2; 0 -0.9; 0 -0.4; 0 0"/>
    <g transform="rotate(-36 32 32)">

      <!-- the violet glow round the hilt, and the soft glow along the cutting edge -->
      <ellipse cx="10" cy="32" rx="7.5" ry="4.8" fill="#8f4dff" opacity=".35" filter="url(#soft)">
        <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values=".25; .35; .45; .35; .25"/>
      </ellipse>
      <path d="M19.4 33 C32 34 50 32.8 59.8 29.4" fill="none" stroke="#8f4dff" stroke-width="2.6" stroke-linecap="round" opacity=".3" filter="url(#soft)">
        <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values=".22; .3; .38; .3; .22"/>
      </path>

      <!-- the blade: dark steel, curving up to the tip, the cutting edge on the underside -->
      <path d="M19 30.4 C30 31.2 50 30.4 62.4 27.2 L60.4 29.6 C50 33.4 32 34.6 19 33.6 Z"
        fill="#2b3245" stroke="#07090d" stroke-width=".5" stroke-linejoin="round"/>
      <!-- the spine's highlight, and the ridge between the flat and the edge -->
      <path d="M19.6 30.9 C30 31.7 50 30.9 61.4 27.8" fill="none" stroke="#66738f" stroke-width=".35" opacity=".9"/>
      <path d="M19.6 32 C31 32.8 50 32 59.6 28.9" fill="none" stroke="#151a26" stroke-width=".3" opacity=".8"/>
      <!-- the restrained violet edge: a pale violet line with a thin bright core -->
      <path d="M19.4 33 C32 34 50 32.8 59.8 29.4" fill="none" stroke="#b79cff" stroke-width=".8" stroke-linecap="round">
        <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values=".7; .8; .95; .8; .7"/>
      </path>
      <path d="M19.8 32.9 C32 33.9 50 32.7 59.2 29.6" fill="none" stroke="#efe6ff" stroke-width=".25" stroke-linecap="round" opacity=".9"/>

      <!-- two faint wisps off the edge near the tip, taking turns -->
      <path d="M56 27.4 C54 25.6 55.4 24.4 53.4 22.6" fill="none" stroke="#b79cff" stroke-width=".5" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="0; .7; 0; 0; 0"/>
      </path>
      <path d="M48 29 C46.4 27.4 47.6 26.2 46 24.6" fill="none" stroke="#b79cff" stroke-width=".5" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values="0; 0; 0; .7; 0"/>
      </path>

      <!-- the guard and the collar -->
      <ellipse cx="17.7" cy="32" rx="1.3" ry="4.6" fill="#9aa6b8" stroke="#07090d" stroke-width=".4"/>
      <ellipse cx="17.7" cy="32" rx=".5" ry="3.3" fill="none" stroke="#5b6678" stroke-width=".25"/>
      <rect x="18.2" y="29.9" width="1.2" height="4.2" fill="#9aa6b8" stroke="#07090d" stroke-width=".2"/>

      <!-- the hilt: wrapped deep violet in a diamond lattice, a steel collar and pommel -->
      <path d="M4.8 32 L16.4 32" fill="none" stroke="#07090d" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M4.8 32 L16.4 32" fill="none" stroke="#3a2a70" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M5.7 30.6 L7.1 33.4 M5.7 33.4 L7.1 30.6 M7.9 30.6 L9.3 33.4 M7.9 33.4 L9.3 30.6 M10.1 30.6 L11.5 33.4 M10.1 33.4 L11.5 30.6 M12.3 30.6 L13.7 33.4 M12.3 33.4 L13.7 30.6 M14.3 30.6 L15.7 33.4 M14.3 33.4 L15.7 30.6" fill="none" stroke="#6a52b0" stroke-width=".35"/>
      <rect x="15.9" y="29.9" width="1.1" height="4.2" fill="#9aa6b8" stroke="#07090d" stroke-width=".2"/>
      <ellipse cx="4.2" cy="32" rx="1.3" ry="2.3" fill="#9aa6b8" stroke="#07090d" stroke-width=".25"/>
    </g>
  </g>
</svg>

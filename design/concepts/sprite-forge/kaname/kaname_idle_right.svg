<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Kaname, idle, facing right as in the game. A sprite-forge concept for viewing: a PROPOSAL, not canon (D129); Unity owns the look (D124).
       Palette from js/art_hero.js (D117): black outfit, deep-violet band, sash and scarf, pale-blue rim, white eyes, a violet glow on the hilt.
       No arms (D103), no smoke, no tail on the hood, nothing red or yellow. The scarf is the headband's tail (one cloth). -->
  <defs>
    <clipPath id="cpBody"><ellipse cx="32" cy="46" rx="9.4" ry="8"/></clipPath>
    <clipPath id="cpHead"><circle cx="32" cy="28.3" r="14"/></clipPath>
    <radialGradient id="eyeGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#cfe6ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.7"/></filter>
  </defs>

  <!-- ground shadow and the two round feet: planted, they do not move -->
  <ellipse cx="32" cy="58.4" rx="13" ry="1.8" fill="#07090d" opacity=".18"/>
  <ellipse cx="25.3" cy="54" rx="5.6" ry="3.9" fill="#07090d" stroke="#7fa8e8" stroke-width=".3"/>
  <ellipse cx="39.3" cy="54" rx="5.6" ry="3.9" fill="#07090d" stroke="#7fa8e8" stroke-width=".3"/>

  <!-- the body and the katana worn at the hip: hilt forward with its violet glow, the scabbard trailing behind. It rises a little less than the head (breathing). -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
      values="0 -0.1; 0 -0.4; 0 -0.7; 0 -0.5; 0 -0.2; 0 0; 0 -0.1"/>

    <!-- the scabbard, behind the body: dark violet, steel fittings, no tags -->
    <path d="M23.8 47.3 L9.4 51.1" fill="none" stroke="#07090d" stroke-width="2.9" stroke-linecap="round"/>
    <path d="M23.8 47.3 L9.4 51.1" fill="none" stroke="#241a46" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M22.6 47.6 L10.6 50.8" fill="none" stroke="#4a3a80" stroke-width=".35" opacity=".8"/>
    <rect x="-.7" y="-1.3" width="1.4" height="2.6" rx=".3" transform="translate(9.8 51) rotate(-15)" fill="#9aa6b8" stroke="#07090d" stroke-width=".18"/>
    <rect x="-.7" y="-1.3" width="1.4" height="2.6" rx=".3" transform="translate(20.6 48.2) rotate(-15)" fill="#9aa6b8" stroke="#07090d" stroke-width=".18"/>

    <!-- the body, with the deep-violet sash across it -->
    <ellipse cx="32" cy="46" rx="9.4" ry="8" fill="#07090d" stroke="#7fa8e8" stroke-width=".3"/>
    <g clip-path="url(#cpBody)">
      <path d="M20 48.6 C26 51.6 38 51.6 44 48.6 L44 51.4 C38 54.4 26 54.4 20 51.4 Z" fill="#3a2273" stroke="#150a30" stroke-width=".25"/>
    </g>
    <!-- the sash's knotted end, swinging a little behind the breath -->
    <path d="M24.6 52.2 L21.4 57 L26.6 55.2 Z" fill="#3a2273" stroke="#150a30" stroke-width=".2" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
        values="0 24.6 52.4; 4 24.6 52.4; 0 24.6 52.4; -4 24.6 52.4; 0 24.6 52.4"/>
    </path>

    <!-- the violet glow standing in for the curse, then the hilt: wrapped, a steel guard and pommel -->
    <ellipse cx="52" cy="40.4" rx="5.2" ry="4.2" fill="#8f4dff" opacity=".4" filter="url(#soft)">
      <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values=".3; .4; .48; .4; .3"/>
    </ellipse>
    <path d="M40.2 42.7 L53.4 40.1" fill="none" stroke="#07090d" stroke-width="2.6"/>
    <path d="M40.2 42.7 L53.4 40.1" fill="none" stroke="#3a2a70" stroke-width="2"/>
    <path d="M42.04 41.43 L42.36 43.09 M44.04 41.04 L44.36 42.7 M46.04 40.66 L46.36 42.32 M48.04 40.27 L48.36 41.93 M50.04 39.89 L50.36 41.55" fill="none" stroke="#6a52b0" stroke-width=".3"/>
    <ellipse cx="40.5" cy="42.6" rx=".9" ry="2.2" transform="rotate(-10 40.5 42.6)" fill="#9aa6b8" stroke="#07090d" stroke-width=".2"/>
    <circle cx="53.6" cy="40.05" r="1.05" fill="#9aa6b8" stroke="#07090d" stroke-width=".2"/>
  </g>

  <!-- the head: it rises most, the scarf drags behind it -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="1.2s" repeatCount="indefinite"
      values="0 0; 0 -0.5; 0 -1.2; 0 -1.6; 0 -1.2; 0 -0.5; 0 0"/>

    <!-- the scarf: the band's tail, tapering back and down, swinging from its root on the band; it lags the head and lifts as the head drops -->
    <path d="M19 25 C14 23.6 8.8 25.6 5.2 30.4 C3.8 32.4 2.9 34.6 2.4 37.2 C4.4 34.6 5.8 33 7.8 31.8 C10.8 30 14.6 29.6 19 29.8 Z"
      fill="#3a2273" stroke="#150a30" stroke-width=".3" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" dur="1.2s" repeatCount="indefinite"
        values="0 19 27.4; -3.5 19 27.4; -7 19 27.4; -3.5 19 27.4; 0 19 27.4; 3.5 19 27.4; 7 19 27.4; 3.5 19 27.4; 0 19 27.4"/>
    </path>

    <!-- the round black hood -->
    <circle cx="32" cy="28.3" r="14" fill="#07090d"/>
    <!-- the deep-violet headband wrapped round the head above the eyes -->
    <g clip-path="url(#cpHead)">
      <path d="M16 24.2 C24 25.6 40 25.6 48 24.2 L48 29.8 C40 31.2 24 31.2 16 29.8 Z" fill="#3a2273"/>
      <path d="M16 24.2 C24 25.6 40 25.6 48 24.2" fill="none" stroke="#150a30" stroke-width=".3"/>
      <path d="M16 29.8 C24 31.2 40 31.2 48 29.8" fill="none" stroke="#150a30" stroke-width=".3"/>
      <path d="M17 24.9 C24 26.2 40 26.2 47 24.9" fill="none" stroke="#5a3ca0" stroke-width=".3" opacity=".7"/>
    </g>
    <circle cx="32" cy="28.3" r="14" fill="none" stroke="#7fa8e8" stroke-width=".3"/>

    <!-- the glowing white eyes, looking right, just under the band -->
    <ellipse cx="39" cy="32" rx="8.5" ry="5" fill="url(#eyeGlow)">
      <animate attributeName="opacity" dur="1.2s" repeatCount="indefinite" values=".6; .75; .9; .75; .6"/>
    </ellipse>
    <ellipse cx="35.4" cy="32.5" rx="3.3" ry="1.5" transform="rotate(-14 35.4 32.5)" fill="#ffffff"/>
    <ellipse cx="41.6" cy="31.3" rx="3" ry="1.4" transform="rotate(-14 41.6 31.3)" fill="#ffffff"/>
  </g>
</svg>

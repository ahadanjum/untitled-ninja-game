<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#090c26"/><stop offset=".6" stop-color="#1a1548"/><stop offset="1" stop-color="#2a1d5e"/></linearGradient>
  <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffbf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffbf7a" stop-opacity="0"/></radialGradient>
  <radialGradient id="eyeGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#cfe6ff" stop-opacity=".75"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/></radialGradient>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="0.5"/></filter>
  <filter id="glowF" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.1"/></filter>
</defs>

<!-- night, a few lanterns, a plank deck: the Little Shinobi mood -->
<rect width="800" height="900" fill="url(#sky)"/>
<circle cx="130" cy="520" r="120" fill="url(#lamp)"/><circle cx="680" cy="560" r="110" fill="url(#lamp)"/>
<g fill="#c8d8ff" opacity=".7"><circle cx="90" cy="150" r="1.8"/><circle cx="210" cy="230" r="1.5"/><circle cx="330" cy="120" r="2"/><circle cx="470" cy="190" r="1.5"/><circle cx="600" cy="110" r="2"/><circle cx="700" cy="260" r="1.6"/><circle cx="560" cy="330" r="1.3"/><circle cx="120" cy="380" r="1.4"/></g>
<path d="M0 700 C120 670 220 690 330 676 C470 660 580 690 800 668 L800 900 L0 900 Z" fill="#150f3a" opacity=".8"/>
<rect x="0" y="790" width="800" height="110" fill="#120d30"/>
<rect x="0" y="788" width="800" height="3" fill="#3a2f66"/>
<g stroke="#241a4c" stroke-width="2"><path d="M0 830 H800 M0 870 H800"/><path d="M120 791 V830 M300 791 V830 M520 791 V830 M700 791 V830 M60 830 V870 M240 830 V870 M440 830 V870 M620 830 V870 M780 830 V870"/></g>

<text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#e3e8ff">C · like Little Shinobi</text>
<text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#9fa9d6">ink silhouette, thin pale rim, glowing eyes; simplified</text>

<!-- the hero, in the first game's units (head radius 12.4, ground at y = 0), scaled up -->
<g transform="translate(400 790) scale(10.4)" stroke-linejoin="round" stroke-linecap="round">
  <ellipse cx="0" cy="0.4" rx="15" ry="1.7" fill="#000" opacity=".45" stroke="none" filter="url(#soft)"/>

  <!-- scarf: pale blue, two tails, trailing back -->
  <path d="M-2 -17.5 C-8 -15 -13 -18.6 -19 -16.4 C-25 -14.2 -29 -17.6 -36 -15.4 C-31 -20 -26 -22.2 -20 -21.6 C-14 -21 -8 -22.6 -2 -21 Z" fill="#8fb4ff" stroke="#1c3380" stroke-width=".34"/>
  <path d="M-2 -16.5 C-8 -14.5 -12 -10.4 -18 -8.6 C-23 -7.2 -27 -8.6 -32 -5.2 C-28 -11.6 -22 -13.8 -15 -15.6 C-10 -16.8 -6 -18 -2 -19 Z" fill="#5f86e0" stroke="#1c3380" stroke-width=".34"/>

  <!-- far arm trailing back: bare, with the rope coil -->
  <path d="M-5 -16 L-8.6 -11.6 L-10.8 -6.6" fill="none" stroke="#07091c" stroke-width="3.5"/>
  <path d="M-5 -16 L-8.6 -11.6 L-10.8 -6.6" fill="none" stroke="#c49b84" stroke-width="2.6"/>
  <g fill="#b79f78" stroke="#4a3e28" stroke-width=".2"><ellipse cx="-9.6" cy="-10.4" rx="2.1" ry=".8" transform="rotate(-25 -9.6 -10.4)"/><ellipse cx="-10.1" cy="-9.2" rx="2.1" ry=".8" transform="rotate(-25 -10.1 -9.2)"/><ellipse cx="-10.6" cy="-8" rx="2.1" ry=".8" transform="rotate(-25 -10.6 -8)"/></g>
  <path d="M-10.8 -6.6 C-12 -4.6 -12.4 -3 -11.6 -1.4" fill="none" stroke="#b79f78" stroke-width=".5"/>

  <!-- the katana in its sheath at the hip: plain, steel fittings, no tags -->
  <path d="M12 -13.2 L-19.6 -5.9" stroke="#07090d" stroke-width="2.9"/>
  <path d="M12 -13.2 L-19.6 -5.9" stroke="#241a46" stroke-width="2.3"/>
  <path d="M11 -13 L-18.5 -6.2" stroke="#4a3a80" stroke-width=".35" opacity=".8"/>
  <rect x="-1" y="-1.15" width="1.5" height="2.8" rx=".3" transform="translate(4.4 -11) rotate(-13)" fill="#9aa6b8" stroke="#07090d" stroke-width=".18"/>
  <rect x="-1" y="-1.15" width="1.5" height="2.8" rx=".3" transform="translate(-19 -5.9) rotate(-13)" fill="#9aa6b8" stroke="#07090d" stroke-width=".18"/>

  <!-- feet and body -->
  <ellipse cx="-4" cy="-3" rx="4.6" ry="3.7" fill="#07090d" stroke="#7fa8e8" stroke-width=".3"/>
  <ellipse cx="5.5" cy="-3.4" rx="4.6" ry="3.7" fill="#07090d" stroke="#7fa8e8" stroke-width=".3"/>
  <ellipse cx="0" cy="-11" rx="7.8" ry="9" fill="#0b1236" stroke="#7fa8e8" stroke-width=".3"/>
  <!-- blue sash across the body -->
  <path d="M-7.5 -8.8 C-3 -6.6 3 -6.6 7.5 -8.8 L7.2 -6.4 C3 -4.2 -3 -4.2 -7.2 -6.4 Z" fill="#3c63c8" stroke="#07090d" stroke-width=".2"/>
  <path d="M-7 -7.6 C-9 -6.4 -10 -5 -10.4 -3 C-8.6 -4.2 -7.4 -4.6 -6.2 -4.8 Z" fill="#3c63c8" stroke="#07090d" stroke-width=".2"/>

  <!-- head: a round hood with a small knotted tail, no headband; glowing eyes -->
  <path d="M-9.4 -29.4 C-15 -31.6 -20 -29.6 -23.4 -24.6 C-19 -26 -14.6 -25.8 -10.4 -24.4 Z" fill="#07090d" stroke="#7fa8e8" stroke-width=".3"/>
  <circle cx="0" cy="-26" r="12.4" fill="#0b1236" stroke="#7fa8e8" stroke-width=".3"/>
  <path d="M-11.6 -22 C-4 -20 6 -20 12 -23" fill="none" stroke="#1c2c6a" stroke-width=".5"/>
  <ellipse cx="5" cy="-22.6" rx="6.4" ry="3.6" fill="url(#eyeGlow)" stroke="none"/>
  <g fill="#ffffff" stroke="none"><ellipse cx="2.6" cy="-22.5" rx="2.8" ry="1.2" transform="rotate(-18 2.6 -22.5)"/><ellipse cx="8.6" cy="-23.2" rx="2.6" ry="1.15" transform="rotate(-18 8.6 -23.2)"/></g>

  <!-- near arm: bare upper arm, the cursed forearm glowing violet-black -->
  <path d="M5.2 -16 L8.6 -11.4" fill="none" stroke="#07091c" stroke-width="3.6"/>
  <path d="M5.2 -16 L8.6 -11.4" fill="none" stroke="#d1a58d" stroke-width="2.8"/>
  <ellipse cx="11" cy="-12.6" rx="5" ry="3.4" fill="#8f4dff" opacity=".55" stroke="none" filter="url(#glowF)"/>
  <path d="M8.6 -11.4 L12.6 -12.9" fill="none" stroke="#07091c" stroke-width="3.6"/>
  <path d="M8.6 -11.4 L12.6 -12.9" fill="none" stroke="#2a1450" stroke-width="2.8"/>
  <path d="M9.2 -12.2 L10.4 -11.5 L10.8 -12.8 L12 -12.1 M9.4 -10.9 L10.6 -10.6" fill="none" stroke="#c9a6ff" stroke-width=".28"/>
  <!-- hilt and the hand on it -->
  <path d="M12.6 -13.1 L18 -15" stroke="#07090d" stroke-width="2.5"/>
  <path d="M12.6 -13.1 L18 -15" stroke="#3a2a70" stroke-width="1.9"/>
  <path d="M14.2 -13.2 L14.6 -14.8 M15.6 -13.7 L16 -15.3 M17 -14.2 L17.4 -15.8" stroke="#6a52b0" stroke-width=".28"/>
  <ellipse cx="12.1" cy="-13.4" rx=".9" ry="2.1" transform="rotate(-18 12.1 -13.4)" fill="#9aa6b8" stroke="#07090d" stroke-width=".2"/>
  <circle cx="18.3" cy="-15.1" r="1" fill="#9aa6b8" stroke="#07090d" stroke-width=".2"/>
  <ellipse cx="13.6" cy="-13.7" rx="1.9" ry="1.6" fill="#d1a58d" stroke="#07091c" stroke-width=".3"/>

  <!-- a thread of violet-black smoke off the hilt -->
  <ellipse cx="17.4" cy="-15.6" rx="3.4" ry="2.6" fill="#8f4dff" opacity=".4" stroke="none" filter="url(#glowF)"/>
  <path d="M17.2 -16 C15.6 -18.4 18.2 -19.8 17 -22.4 C16.6 -23.6 17.4 -24.8 18.2 -25.6 C17.8 -24 18.6 -22.6 18.1 -20.8 C17.6 -18.6 19.4 -17.6 18.2 -16 Z" fill="#1d0c3a" opacity=".9" stroke="none"/>
</g>
</svg>
